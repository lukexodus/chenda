# Docker Compose file for local development/testing.
# Start all services: docker compose up -d
# Stop all services: docker compose down
# Rebuild images after code/Dockerfile changes: docker compose up -d --build
# View logs: docker compose logs -f backend

services:
  # PostgreSQL + PostGIS database service.
  # Other services use the hostname "db" to connect to this container.
  db:
    image: postgis/postgis:16-3.4-alpine
    # Restart automatically unless you explicitly stop the container.
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      # Named volume keeps database files between container restarts/recreates.
      - postgres_data:/var/lib/postgresql/data
    ports:
      # host:container mapping. Defaults to 5433 so it doesn't clash with a local PostgreSQL on 5432.
      - "${DB_HOST_PORT}:5432"
    healthcheck:
      # Marks DB as healthy only when it can accept connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d chenda"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js API server.
  backend:
    # Build image from ./server/Dockerfile.
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        # Wait for DB healthcheck to pass before starting backend.
        condition: service_healthy
    env_file:
      - .env.docker
    volumes:
      # Persist uploaded files outside the container filesystem.
      - uploads_data:/app/uploads
    ports:
      # API exposed at http://localhost:3001
      - "3001:3001"

  # Next.js frontend application.
  frontend:
    # Build image from ./chenda-frontend/Dockerfile.
    build:
      context: ./chenda-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      # Starts after backend container starts (does not wait for HTTP readiness).
      - backend
    env_file:
      - .env.docker
    ports:
      # Frontend exposed at http://localhost:3000
      - "3000:3000"

# Named volumes managed by Docker.
# They survive "docker compose down" (unless you pass -v).
volumes:
  postgres_data:
  uploads_data:
